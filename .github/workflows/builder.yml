name: Build Add-on

on:
  push:
    branches: [ "main" ]
    paths:
      - "ha-raumkernel-addon/**"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} add-on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }} add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target ha-raumkernel-addon \
            --image "{arch}-addon-ha-raumkernel-addon" \
            --docker-hub "ghcr.io/simanias" \
            --addon
